name: Publish production images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lexora-production-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/notryag/lexora-api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            image: ghcr.io/notryag/lexora-web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=lexora-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=lexora-${{ matrix.name }}
      - name: Print immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
