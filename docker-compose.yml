services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: ${LEXORA_POSTGRES_MEMORY_LIMIT:-512m}
    memswap_limit: ${LEXORA_POSTGRES_MEMORY_SWAP_LIMIT:-512m}
    pids_limit: ${LEXORA_POSTGRES_PIDS_LIMIT:-128}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexora}
      POSTGRES_USER: ${POSTGRES_USER:-lexora}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lexora} -d ${POSTGRES_DB:-lexora}",
        ]
      interval: 1h
      start_interval: 5s
      start_period: 30s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - lexora-postgres-data:/var/lib/postgresql/data

  api:
    image: ${LEXORA_API_IMAGE:-lexora-api:local}
    restart: unless-stopped
    mem_limit: ${LEXORA_API_MEMORY_LIMIT:-768m}
    memswap_limit: ${LEXORA_API_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: ${LEXORA_API_PIDS_LIMIT:-256}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lexora}:${POSTGRES_PASSWORD:-lexora}@postgres:5432/${POSTGRES_DB:-lexora}
      LEGAL_SOURCE_REPOSITORY_PATH: /data/lvyan-lawtext
      LEXORA_HOST: 0.0.0.0
      LEXORA_PORT: 8011
    command:
      - sh
      - -c
      - /app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/lexora-api
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - ../lvyan-lawtext:/data/lvyan-lawtext:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/v1/health', timeout=5).read()",
        ]
      interval: 1h
      start_interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${LEXORA_WEB_IMAGE:-lexora-web:local}
    restart: unless-stopped
    mem_limit: ${LEXORA_WEB_MEMORY_LIMIT:-256m}
    memswap_limit: ${LEXORA_WEB_MEMORY_SWAP_LIMIT:-256m}
    pids_limit: ${LEXORA_WEB_PIDS_LIMIT:-128}
    environment:
      LEXORA_API_URL: http://api:8011
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1h
      start_interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  lexora-postgres-data:
